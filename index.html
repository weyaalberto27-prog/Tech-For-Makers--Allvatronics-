<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <title>AllvaTronics Pro</title>
    <meta name="description" content="Professional canvas-based schematic and PCB design editor." />
    <meta property="og:title" content="AllvaTronics Pro" />
    <meta property="og:description" content="Professional canvas-based schematic and PCB design editor." />
  </head>
  <body>
    <div id="error-overlay" style="position:fixed; z-index:9999; background: rgba(255,0,0,0.8); color: white; display:none; padding:20px; font-family: monospace;"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.innerHTML += msg + '<br/>' + (error ? error.stack : '') + '<hr/>';
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.innerHTML += 'Unhandled Promise Rejection: ' + event.reason + '<br/>' + (event.reason ? event.reason.stack : '') + '<hr/>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
